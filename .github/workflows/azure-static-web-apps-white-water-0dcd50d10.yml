name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - sanjai
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - sanjai

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      # 1. Checkout repo
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # 2. Build Next.js manually (inside /app)
      - name: Install and Build Next.js
        run: |
          cd app
          npm install
          npm run build

      # 3. Deploy prebuilt app
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_WATER_0DCD50D10 }}
          action: "upload"
          app_location: "app"   # folder with package.json
          api_location: ""      # empty for Next.js API routes
          output_location: ""   # empty because we already built manually
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"


